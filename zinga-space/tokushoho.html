<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>特定商取引法に基づく表記 | ZINGA spAce（ワイヤーフレーム）</title>
<link rel="stylesheet" href="assets/wf.css">
</head>
<body data-page="tokushoho">
<div id="wf-header"></div>

<main>
  <section class="page-head"><div class="container">
    <span class="note">⑦ 特商法に関すること</span>
    <p class="en">LEGAL</p><h1>特定商取引法に基づく表記</h1>
  </div></section>
  <section class="section"><div class="container doc">
    <table class="tbl stack">
      <tr><th>販売業者</th><td>〇〇〇〇</td></tr>
      <tr><th>運営統括責任者</th><td>〇〇 〇〇</td></tr>
      <tr><th>所在地</th><td>〒000-0000 〇〇県〇〇市〇〇</td></tr>
      <tr><th>電話番号</th><td>000-0000-0000（受付時間 〇:〇〇〜〇:〇〇）</td></tr>
      <tr><th>メールアドレス</th><td>info@example.com</td></tr>
      <tr><th>販売価格</th><td>各サービスページに記載</td></tr>
      <tr><th>商品代金以外の必要料金</th><td>送料・振込手数料 など</td></tr>
      <tr><th>お支払い方法</th><td>クレジットカード・銀行振込 など</td></tr>
      <tr><th>お支払い時期</th><td>〇〇</td></tr>
      <tr><th>商品の引渡し時期</th><td>ご注文から〇週間程度</td></tr>
      <tr><th>返品・交換について</th><td>オーダーメイド品のため、お客様都合の返品はお受けできません（不良品を除く）など</td></tr>
    </table>
  </div></section>
</main>

<div id="wf-footer"></div>
<script src="assets/wf.js"></script>
</body>
</html>
