<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ | ZINGA spAce（ワイヤーフレーム）</title>
<link rel="stylesheet" href="assets/wf.css">
</head>
<body data-page="contact">
<div id="wf-header"></div>

<main>
  <section class="page-head"><div class="container">
    <span class="note">⑤ お問い合わせ</span>
    <p class="en">CONTACT</p><h1>お問い合わせ</h1>
    <p style="margin-top:12px;color:var(--muted)">ご相談・お見積りはこちらから。〇営業日以内にご返信します。</p>
  </div></section>

  <section class="section"><div class="container">
    <div class="steps"><span class="on">1. 入力</span><span>2. 確認</span><span>3. 完了</span></div>
    <form class="form" onsubmit="return false">
      <div class="field"><label>ご相談の方<span class="req">必須</span></label>
        <div class="choices"><label><input type="radio" name="t"> 個人</label><label><input type="radio" name="t"> 店舗</label><label><input type="radio" name="t"> 法人</label></div></div>
      <div class="field"><label>お問い合わせ内容<span class="req">必須</span></label>
        <select class="input"><option>選択してください</option><option>オリジナル香水</option><option>空間の香りプロデュース</option><option>OEM</option><option>取材・その他</option></select></div>
      <div class="field"><label>お名前<span class="req">必須</span></label><input class="input" type="text"></div>
      <div class="field"><label>会社名・店舗名<span class="opt">任意</span></label><input class="input" type="text"></div>
      <div class="field"><label>メールアドレス<span class="req">必須</span></label><input class="input" type="email"></div>
      <div class="field"><label>電話番号<span class="opt">任意</span></label><input class="input" type="tel"></div>
      <div class="field"><label>ご相談内容<span class="req">必須</span></label><textarea class="input"></textarea></div>
      <div class="field center"><label style="font-weight:400"><input type="checkbox"> <a href="privacy.html">プライバシーポリシー</a>に同意する</label></div>
      <div class="center"><button class="btn fill" type="submit">確認画面へ</button></div>
    </form>
  </div></section>
</main>

<div id="wf-footer"></div>
<script src="assets/wf.js"></script>
</body>
</html>
